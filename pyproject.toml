[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "peoplecontext-client"
version = "0.1.0"
description = "Portable peoplecontext command-line client"
requires-python = ">=3.11"
dependencies = ["observecontext-client @ git+https://github.com/pocketcontext/observecontext.git@49cf708640b6275a5e89107d097b2a1ce2d262fa"]

[project.scripts]
peoplecontext = "peoplecontext_client.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/peoplecontext_client"]
